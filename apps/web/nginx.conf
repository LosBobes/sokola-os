# Serves the built SPA and proxies /api/ to the `api` Compose service
# internally, so the browser sees a single same-origin host (this container).
# The Hetzner host Caddy then reverse-proxies the public domain to this
# container's published loopback port — see ops/hetzner/Caddyfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: let React Router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, proxied to the api container on the internal network.
    # `api` resolves via Docker Compose's embedded DNS (127.0.0.11); matches
    # vite.config.ts's dev proxy rewrite (/api/foo -> /foo on the API).
    #
    # proxy_pass uses a variable (not a bare hostname) on purpose: nginx only
    # resolves bare hostnames once, at startup, and refuses to start at all if
    # `api` isn't resolvable yet (a real risk if the api container is briefly
    # down or restarting). Routing through $api_upstream forces nginx to
    # re-resolve via the resolver directive on each request instead.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
