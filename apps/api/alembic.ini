[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Database URL is injected from app settings in migrations/env.py; this value is
# a non-secret fallback for tooling only.
sqlalchemy.url = postgresql+psycopg://sokola:sokola@localhost:55432/sokola

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
