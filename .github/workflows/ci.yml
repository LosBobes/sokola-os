name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 🐍 API · lint · types · architecture · migrations · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sokola
          POSTGRES_PASSWORD: sokola
          POSTGRES_DB: sokola
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sokola" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      SOKOLA_ENVIRONMENT: test
      SOKOLA_ALLOW_INSECURE_DEV_AUTH: "true"
      SOKOLA_DATABASE_URL: postgresql+psycopg://sokola:sokola@localhost:5432/sokola
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: 📦 Install dependencies
        run: pip install -e '.[dev]'
      - name: 🧹 Ruff
        run: ruff check app tests
      - name: 🔍 Mypy
        run: mypy app
      - name: 🏛️ Architecture gate
        run: python -m scripts.check_architecture
      - name: 🌿 Alembic single head check
        run: |
          heads="$(alembic heads)"
          count="$(printf '%s\n' "$heads" | grep -c .)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $count:"
            printf '%s\n' "$heads"
            exit 1
          fi
          echo "OK: single Alembic head -> $heads"
      - name: ⬆️ Alembic upgrade and check
        run: |
          alembic upgrade head
          alembic check
      - name: 🧪 Pytest (real Postgres)
        run: pytest
      - name: 🤝 OpenAPI parity
        run: python -m scripts.check_openapi_parity

  web:
    name: ⚛️ Web · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🔄 OpenAPI types are in sync
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: 🏗️ Build (tsc + vite)
        run: npm run build

  e2e:
    name: 🌲 E2E · Cypress against live stack
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sokola
          POSTGRES_PASSWORD: sokola
          POSTGRES_DB: sokola
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sokola" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      SOKOLA_ENVIRONMENT: local
      SOKOLA_ALLOW_INSECURE_DEV_AUTH: "true"
      SOKOLA_DATABASE_URL: postgresql+psycopg://sokola:sokola@localhost:5432/sokola
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: 🚀 Start API
        working-directory: apps/api
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 🏗️ Build and serve web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          nohup npm run preview > /tmp/web.log 2>&1 &
      - name: ⏳ Wait for stack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:5173 && break
            sleep 2
          done
      - name: 🌲 Cypress run
        working-directory: apps/web
        run: npx cypress run --e2e
